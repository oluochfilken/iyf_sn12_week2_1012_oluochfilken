<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Oluoch Filken.">
  <title>Contact | Oluoch Filken</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Oluoch Filken</a>
      <input class="menu-checkbox" type="checkbox" id="menu-toggle">
      <label class="menu-label" for="menu-toggle">Menu ☰</label>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1 class="section-title">Contact Me</h1>
    <p class="muted">Use the form below to send a message.</p>

    <section class="card">
      <form class="contact-form" action="#" method="post">

        <fieldset>
          <legend>Personal Information</legend>

          <label for="name">Full Name</label>
          <input type="text" id="name" name="name"
                 placeholder="Enter your full name" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"
                 placeholder="Enter your email address" required>
        </fieldset>

        <fieldset>
          <legend>Message Details</legend>

          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject"
                 placeholder="Enter the subject" required>

          <label for="message">Your Message</label>
          <textarea id="message" name="message"
                    placeholder="Write your message here" required></textarea>
        </fieldset>

        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Oluoch Filken. All rights reserved.</p>
  </footer>

</body>
</html>
