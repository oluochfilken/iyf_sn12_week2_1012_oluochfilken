<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 1 - Button Styles</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="container section">
    <section class="challenge-card">
      <h1>Day 1: Button Styles</h1>
      <p>Four different button styles created using reusable CSS classes.</p>

      <div class="flex-demo">
        <button class="btn btn-primary" type="button">Primary Button</button>
        <button class="btn btn-secondary" type="button">Secondary Button</button>
        <button class="btn btn-danger" type="button">Danger Button</button>
        <button class="btn btn-primary" type="button" disabled>Disabled Button</button>
      </div>

      <p class="section">
        The buttons demonstrate primary, secondary, danger and disabled states.
      </p>

      <a href="../index.html">Return to Portfolio</a>
